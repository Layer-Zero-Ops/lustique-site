name = "lustique-form-handler"
main = "src/index.ts"
compatibility_date = "2026-06-04"
account_id = "d5ae10088a019ff6975fcbe128f8e0be"

# Route — intercepts /api/* on the live domain while Pages serves everything else.
# Requires the lustiqueco.co.za zone to exist in this Cloudflare account first.
routes = [{ pattern = "lustiqueco.co.za/api/*", zone_name = "lustiqueco.co.za" }]

# Public, non-secret config:
[vars]
ALLOWED_ORIGIN = "https://lustiqueco.co.za"

# Secrets — pulled from CF Secrets Store (ff54a0a001304d07beaa3c45d205cb52).
# To add/rotate a secret: update it in the CF Secrets Store, then redeploy.
# NOTIFY_EMAIL and SIGNING_SECRET must be created in the Store if not already present.
# YOCO_SECRET_KEY + YOCO_WEBHOOK_SECRET added to Store when S4-v2 deploys.
# EFT bank details are stored in the business_settings table (not Worker secrets).

[[secrets_store_secrets]]
binding = "BREVO_API_KEY"
secret_name = "BREVO_API_KEY"
store_id = "ff54a0a001304d07beaa3c45d205cb52"

[[secrets_store_secrets]]
binding = "SUPABASE_URL"
secret_name = "SUPABASE_URL"
store_id = "ff54a0a001304d07beaa3c45d205cb52"

[[secrets_store_secrets]]
binding = "SUPABASE_SERVICE_KEY"
secret_name = "SUPABASE_SERVICE_KEY"
store_id = "ff54a0a001304d07beaa3c45d205cb52"

[[secrets_store_secrets]]
binding = "TURNSTILE_SECRET"
secret_name = "TURNSTILE_SECRET"
store_id = "ff54a0a001304d07beaa3c45d205cb52"

[[secrets_store_secrets]]
binding = "SIGNING_SECRET"
secret_name = "SIGNING_SECRET"
store_id = "ff54a0a001304d07beaa3c45d205cb52"

[[secrets_store_secrets]]
binding = "NOTIFY_EMAIL"
secret_name = "NOTIFY_EMAIL"
store_id = "ff54a0a001304d07beaa3c45d205cb52"

# Booking core (S1):
[[r2_buckets]]
binding = "AUDIT"
bucket_name = "lustique-audit"

[triggers]
crons = ["0 6 * * *"]   # 06:00 UTC ≈ 08:00 SAST — keep-warm now; balance sweep in S5
