name = "lustique-form-handler"
main = "src/index.ts"
compatibility_date = "2026-06-04"

# Route — intercepts /api/* on the live domain while Pages serves everything else.
# Requires the lustiqueco.co.za zone to exist in this Cloudflare account first.
routes = [{ pattern = "lustiqueco.co.za/api/*", zone_name = "lustiqueco.co.za" }]

# Public, non-secret config:
[vars]
ALLOWED_ORIGIN = "https://lustiqueco.co.za"

# Secrets — set with `wrangler secret put NAME`, NEVER committed:
#   BREVO_API_KEY         — Brevo transactional-email key
#   NOTIFY_EMAIL          — Brevo-verified sender + Zandeline's inbox (e.g. info@lustiqueco.co.za)
#   SUPABASE_URL          — Supabase project URL (e.g. https://abc.supabase.co)
#   SUPABASE_SERVICE_KEY  — Supabase service-role key (bypasses RLS)
#   SIGNING_SECRET        — HMAC secret for confirm + mark-paid tokens (random 32-byte hex)
#   TURNSTILE_SECRET      — Cloudflare Turnstile secret key (S2 bot protection)
#   EFT_BANK              — Bank name shown in the bride's payment-invitation email
#   EFT_ACCOUNT_NAME      — Account holder name
#   EFT_ACCOUNT_NO        — Account number
#   EFT_BRANCH_CODE       — Branch / sort code
#   YOCO_SECRET_KEY       — Yoco API secret key (S4-v2, not yet deployed)
#   YOCO_WEBHOOK_SECRET   — Yoco webhook signing secret (S4-v2, not yet deployed)

# Booking core (S1):
[[r2_buckets]]
binding = "AUDIT"
bucket_name = "lustique-audit"

[triggers]
crons = ["0 6 * * *"]   # 06:00 UTC ≈ 08:00 SAST — keep-warm now; balance sweep in S5
