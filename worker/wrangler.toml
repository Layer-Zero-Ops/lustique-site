name = "lustique-form-handler"
main = "src/index.ts"
compatibility_date = "2026-06-04"
account_id = "d5ae10088a019ff6975fcbe128f8e0be"

# Route — intercepts /api/* on the live domain while Pages serves everything else.
# Requires the lustiqueco.co.za zone to exist in this Cloudflare account first.
routes = [{ pattern = "lustiqueco.co.za/api/*", zone_name = "lustiqueco.co.za" }]

# Public, non-secret config:
[vars]
ALLOWED_ORIGIN = "https://lustiqueco.co.za"

# Secrets — set directly on the Worker (CF dashboard → lustique-form-handler → Settings → Variables & Secrets).
# Source of truth for values: CF Secrets Store (ff54a0a001304d07beaa3c45d205cb52).
# When rotating a key: update the Store first, then re-enter the new value on the Worker.
# Required secrets: BREVO_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_KEY,
#                   TURNSTILE_SECRET, SIGNING_SECRET, NOTIFY_EMAIL
# Future (S4-v2): YOCO_SECRET_KEY, YOCO_WEBHOOK_SECRET
# EFT bank details: business_settings table, not Worker secrets.

# Booking core (S1):
[[r2_buckets]]
binding = "AUDIT"
bucket_name = "lustique-audit"

[triggers]
crons = ["0 6 * * *"]   # 06:00 UTC ≈ 08:00 SAST — keep-warm now; balance sweep in S5
