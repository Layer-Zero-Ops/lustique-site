name = "lustique-form-handler"
main = "src/index.ts"
compatibility_date = "2026-06-04"
account_id = "d5ae10088a019ff6975fcbe128f8e0be"

# Route — intercepts /api/* on the live domain while Pages serves everything else.
# Requires the lustiqueco.co.za zone to exist in this Cloudflare account first.
routes = [{ pattern = "lustiqueco.co.za/api/*", zone_name = "lustiqueco.co.za" }]

# Public, non-secret config:
[vars]
ALLOWED_ORIGIN = "https://lustiqueco.co.za"
# Yoco card fee rate — for margin/reporting only; NOT added to what the bride is charged
# (Lustique absorbs the fee — locked 2026-06-18). Verify the real rate in the Yoco Business
# Portal → Settings → Pricing and update this value before going live.
YOCO_FEE_PCT = "2.95"

# Secrets — set directly on the Worker (CF dashboard → lustique-form-handler → Settings → Variables & Secrets).
# Source of truth for values: CF Secrets Store (ff54a0a001304d07beaa3c45d205cb52).
# When rotating a key: update the Store first, then re-enter the new value on the Worker.
# Required secrets: BREVO_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_KEY,
#                   TURNSTILE_SECRET, SIGNING_SECRET, NOTIFY_EMAIL
#                   YOCO_SECRET_KEY, YOCO_WEBHOOK_SECRET (Wave 0 — register webhook in Yoco portal
#                   with event types: payment.succeeded, payment.failed, refund.succeeded)
# Wave C Phase 1 (admin dashboard auth):
#   SUPABASE_JWT_SECRET — Supabase dashboard → Settings → API → JWT Settings → JWT Secret
#                         Enables JWT-gated /api/admin/login + /api/admin/dashboard routes.
# Marketing email (admin-composed Brevo campaigns — see worker/src/booking/marketing.ts):
#   BREVO_NEWSLETTER_LIST_ID   — numeric Brevo list ID for newsletter signups (see newsletter.ts)
#   BREVO_PAST_CLIENTS_LIST_ID — numeric Brevo list ID for settled bookings' brides — optional;
#                                the past-clients audience + its settle-time sync are skipped if unset.
# iCal feed (D2 replacement):
#   ICAL_KEY — random URL key for GET /api/calendar.ics?key=<ICAL_KEY>
#              Generate: openssl rand -hex 24
#              Subscribe URL: https://lustiqueco.co.za/api/calendar.ics?key=<ICAL_KEY>
#              Share with Zandeline + all 9 artists (one-time subscribe in Google Calendar / Apple Calendar)
# EFT bank details: business_settings table, not Worker secrets.

# Booking core (S1):
[[r2_buckets]]
binding = "AUDIT"
bucket_name = "lustique-audit"

# Wave D3 — Rate Limiting bindings (CF Workers free tier).
#
# SYNTAX NOTE: [[ratelimits]] uses `name =` (not `binding =`).
# The `name` value becomes the property name on the Env interface, just as
# `binding` does for [[r2_buckets]]. These two stanza types use different field names.
#
# PERIOD CONSTRAINT: only period=10 or period=60 (seconds) is supported.
# Targets like "5/15min" or "3/hour" use the 60s binding as a burst guard only.
# True sliding-window limits require a KV counter layer (Phase 2 — see Task 5).
#
# namespace_id: arbitrary positive integers unique within this CF account.
# CF creates the namespace on first `wrangler deploy`.
# After deploy, confirm all five RL_* bindings appear in:
#   CF dashboard → Workers → lustique-form-handler → Settings → Bindings
# If a namespace_id collides with another Worker in this account, increment all by 100 and redeploy.
#
# Limits (must match RATE_LIMITS constants in worker/src/lib/rateLimit.ts):
#   RL_LOGIN        5 req / 60 s  — POST /api/admin/login (IP key)
#   RL_LOGIN_EMAIL  5 req / 60 s  — POST /api/admin/login (email key)
#   RL_BOOKING      3 req / 60 s  — POST /api/booking/request (IP key)
#   RL_ENQUIRY     10 req / 60 s  — POST /api/enquiry (IP key)
#   RL_ADMIN       60 req / 60 s  — GET /api/admin/* + legacy ADMIN_SECRET routes (IP key)

[[ratelimits]]
name         = "RL_LOGIN"
namespace_id = "1001"

  [ratelimits.simple]
    limit  = 5
    period = 60

[[ratelimits]]
name         = "RL_LOGIN_EMAIL"
namespace_id = "1002"

  [ratelimits.simple]
    limit  = 5
    period = 60

[[ratelimits]]
name         = "RL_BOOKING"
namespace_id = "1003"

  [ratelimits.simple]
    limit  = 3
    period = 60

[[ratelimits]]
name         = "RL_ENQUIRY"
namespace_id = "1004"

  [ratelimits.simple]
    limit  = 10
    period = 60

[[ratelimits]]
name         = "RL_ADMIN"
namespace_id = "1005"

  [ratelimits.simple]
    limit  = 60
    period = 60

[triggers]
crons = ["0 6 * * *"]   # 06:00 UTC ≈ 08:00 SAST — keep-warm now; balance sweep in S5

# ─── Staging environment ───────────────────────────────────────────────────────
# Deploy with: wrangler deploy --env staging
# Secrets: wrangler secret put <NAME> --env staging (use TEST values — see .dev.vars.example)
# Pieter must create before first staging deploy:
#   1. R2 bucket: CF dashboard → R2 → Create bucket "lustique-audit-staging"
#   2. DNS CNAME: staging.lustiqueco.co.za → lustique-form-handler-staging.<account>.workers.dev
#      (or skip the route and use the workers.dev URL for staging smoke tests)

[env.staging]
name = "lustique-form-handler-staging"
routes = [{ pattern = "staging.lustiqueco.co.za/api/*", zone_name = "lustiqueco.co.za" }]
# workers.dev fallback stays enabled until the staging.lustiqueco.co.za DNS CNAME exists —
# without this, a plain `wrangler deploy` silently disables the *.workers.dev endpoint,
# which is currently the ONLY reachable URL for staging (see comment above).
workers_dev = true

[env.staging.vars]
ALLOWED_ORIGIN = "https://staging.lustiqueco.co.za"
YOCO_FEE_PCT = "2.95"

# Staging R2 — separate bucket so audit logs don't mix with prod
[[env.staging.r2_buckets]]
binding = "AUDIT"
bucket_name = "lustique-audit-staging"

# Staging rate limits — separate namespace IDs (2001–2005) so staging traffic
# doesn't consume prod rate limit counters
[[env.staging.ratelimits]]
name         = "RL_LOGIN"
namespace_id = "2001"
  [env.staging.ratelimits.simple]
    limit  = 5
    period = 60

[[env.staging.ratelimits]]
name         = "RL_LOGIN_EMAIL"
namespace_id = "2002"
  [env.staging.ratelimits.simple]
    limit  = 5
    period = 60

[[env.staging.ratelimits]]
name         = "RL_BOOKING"
namespace_id = "2003"
  [env.staging.ratelimits.simple]
    limit  = 3
    period = 60

[[env.staging.ratelimits]]
name         = "RL_ENQUIRY"
namespace_id = "2004"
  [env.staging.ratelimits.simple]
    limit  = 10
    period = 60

[[env.staging.ratelimits]]
name         = "RL_ADMIN"
namespace_id = "2005"
  [env.staging.ratelimits.simple]
    limit  = 60
    period = 60
